services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/secrets:/app/secrets
    expose:
      - "8000"
    env_file:
      - path: ./backend/.env
        required: false

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # SFTP-only server for Reolink to upload motion-triggered JPG snapshots.
  # atmoz/sftp chroots the 'birdcam' user to /home/birdcam/ and only lets
  # them write into the 'upload' subdirectory, which we map to the same
  # data/clips/ directory the api container reads from. A filesystem scan
  # in pipeline/worker.py picks up new files and creates Visit rows.
  #
  # Port 22222 (not 22) so it doesn't clash with the host's admin SSH.
  # SFTP_PASSWORD is generated by bootstrap_server.sh on first deploy and
  # stored in backend/.env.
  sftp:
    image: atmoz/sftp:alpine
    restart: unless-stopped
    ports:
      - "22222:22"
    volumes:
      - ./backend/data/clips:/home/birdcam/upload
      - sftp_keys:/etc/ssh
    command: "birdcam:${SFTP_PASSWORD:-changeme}:1000:1000:upload"

volumes:
  caddy_data:
  caddy_config:
  sftp_keys:
