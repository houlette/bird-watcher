services:
  api:
    # Fixed name so the shared Caddy (in ~/infra/) can reverse_proxy to
    # us by container name over the external `web` network.
    container_name: birdwatcher-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      # Detector inference backend (pipeline/detect.py). OpenVINO since gate
      # 1.5a in DETECTOR_PLAN.md. To go back to PyTorch on the server without
      # a deploy:
      #   YOLO_BACKEND=torch docker compose up -d api
      - YOLO_BACKEND=${YOLO_BACKEND:-openvino}
      # 4 tiles in flight over 4 inference threads. 2 over 2 was tried on
      # 2026-09-15 to save 0.49 GB, on a gate 1.3 benchmark that put the two
      # level, but that benchmark ran with this container paused: in
      # production 2 over 2 ran at 0.364 s per tile over 298 visits against
      # 0.210 s for 4 over 4 over 333 visits, failing gate 1.5b's 0.266 s
      # limit and losing to the PyTorch path it replaced. The memory headroom
      # that 2 over 2 bought is no longer needed at the 5g limit below.
      - YOLO_OPENVINO_STREAMS=${YOLO_OPENVINO_STREAMS:-4}
      - YOLO_OPENVINO_THREADS=${YOLO_OPENVINO_THREADS:-4}
      - YOLO_OPENVINO_MODEL=${YOLO_OPENVINO_MODEL:-/app/models/yolo11s_yard_openvino/best.xml}
      - YOLO_BIRD_CLASS=${YOLO_BIRD_CLASS:-0}
      - YOLO_CONFIDENCE_THRESHOLD=${YOLO_CONFIDENCE_THRESHOLD:-0.35}
    volumes:
      - ./backend/data:/app/data
      # Preserved source frames are cold: written once per labeled
      # detection, never served over HTTP, read only by the retention pass
      # and by a future fine-tune. That makes them the right thing to push
      # onto network storage, leaving the fast root disk entirely to the
      # clip buffer, which is the only thing standing between an arriving
      # clip and deletion before anything looks at it. FRAMES_HOST_PATH
      # lives in backend/.env on the server because the mount point is
      # specific to that machine's attached volume; unset, this keeps the
      # frames where they have always been.
      - ${FRAMES_HOST_PATH:-./backend/data/frames}:/app/data/frames
      - ./backend/models:/app/models
      - ./backend/secrets:/app/secrets
    env_file:
      - path: ./backend/.env
        required: false
    # Cap memory below the host's ~7.6 GB so a runaway worker (large MP4
    # decode + model weights + ffmpeg buffers) gets OOM-killed inside the
    # container without taking down the whole VM. Pair this with the
    # MAX_VIDEO_BYTES cap in pipeline/frames.py so we don't loop on the
    # same problematic file.
    #
    # Raised from 4g on 2026-09-15: with the OpenVINO detector the container
    # held 2.9 GB of process memory and spent the rest on file cache, so it
    # hit the 4 GiB ceiling 4,488 times in 75 minutes and the kernel evicted
    # cached data each time. The other containers hold 570 MB between them and
    # the host reports about 3.8 GB available, so 5g still leaves roughly
    # 2.8 GB outside this container.
    mem_limit: 5g
    networks:
      - web

  # FTPS server for Reolink to upload motion-triggered JPG snapshots.
  # Reolink's RLC-811WA firmware speaks FTP/FTPS, not SFTP — see the
  # decision log in DEVELOPING.md. pure-ftpd serves over port 22222 (control)
  # and 30000-30009 (passive data) with a self-signed TLS cert generated by
  # the container on first run. The Reolink's 'Don't allow plain unencrypted
  # FTP' setting is respected because -Y 2 makes TLS required for AUTH.
  #
  # User chroots into /home/birdcam, can only write into the upload
  # subdirectory, which we map to data/clips/ so the api container's
  # filesystem-scan worker picks new files up automatically.
  #
  # SFTP_PASSWORD env var name retained even though we're not using SFTP
  # any more — same credential, less churn through the rest of the stack.
  ftp:
    image: stilliard/pure-ftpd:latest
    restart: unless-stopped
    ports:
      - "22222:21"
      - "30000-30009:30000-30009"
    environment:
      PUBLICHOST: birdwatcher.ryanhoulette.com
      FTP_USER_NAME: birdcam
      FTP_USER_PASS: ${SFTP_PASSWORD:-changeme}
      FTP_USER_UID: "1000"
      FTP_USER_GID: "1000"
      FTP_USER_HOME: /home/birdcam
      FTP_PASSIVE_PORTS: "30000:30009"
      # --tls=2 is the long form of -Y 2 (TLS required for AUTH). We need
      # the long form because the image's run.sh checks for the literal
      # substring '--tls' to decide whether to auto-generate a self-signed
      # cert; with -Y it skips cert generation and pure-ftpd fails to start.
      ADDED_FLAGS: "--tls=2 -j"
      TLS_CN: birdwatcher.ryanhoulette.com
      TLS_ORG: BirdWatcher
      TLS_C: US
    volumes:
      - ./backend/data/clips:/home/birdcam
      - ftp_tls:/etc/ssl/private

volumes:
  ftp_tls:

# Shared bridge network with the Caddy container in ~/infra/. Created
# once outside of compose with `docker network create web` — see the
# infra repo README.
networks:
  web:
    external: true
    name: web
