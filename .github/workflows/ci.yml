name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Heavy ML deps (torch, transformers, ultralytics) aren't needed by the
      # 37 unit tests — they exercise the tracker, fusion, calibration, notify,
      # species, and corrections modules with the classifier/YOLO singletons
      # never loaded. Install only the lightweight subset so CI stays under
      # 90 s.
      - name: Install backend test deps
        run: |
          pip install --upgrade pip
          pip install \
            fastapi==0.115.0 'uvicorn[standard]==0.32.0' python-multipart==0.0.12 \
            sqlalchemy==2.0.36 alembic==1.13.3 apscheduler==3.10.4 httpx==0.27.2 \
            pillow==11.0.0 numpy==2.1.3 opencv-python-headless==4.10.0.84 \
            pywebpush==2.0.0 cryptography==43.0.3 \
            pydantic==2.9.2 pydantic-settings==2.6.1 python-dotenv==1.0.1 \
            pytest

      - name: Run pytest
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend-build:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: cd frontend && npm ci --no-audit --no-fund

      - name: Type-check + Vite build
        run: cd frontend && npm run build
